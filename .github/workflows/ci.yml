name: CI – Автоматичне тестування

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # Крок 1: клонуємо репозиторій у runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Крок 2: встановлюємо Python 3.11 з кешуванням pip
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Крок 3: встановлюємо залежності проєкту
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Крок 4: запускаємо тести; при падінні тесту exit code != 0
      - name: Run unit tests
        run: pytest --cov=courtbook --cov-report=xml --junitxml=reports/junit.xml

      # Крок 5: зберігаємо звіти навіть якщо тести не пройшли
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            reports/junit.xml
            coverage.xml
          retention-days: 7
