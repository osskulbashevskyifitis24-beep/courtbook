{% extends "base.html" %}
{% block title %}Реєстрація – CourtBook{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="h4 mb-3">Реєстрація</h1>
    <form method="post">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="name" class="form-label">Ім’я</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Телефон</label>
        <input type="tel" class="form-control" id="phone" name="phone" placeholder="+380XXXXXXXXX">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="password" name="password" required>
        <div class="form-text">Мінімум 8 символів, велика літера та цифра</div>
      </div>
      <button type="submit" class="btn btn-success w-100">Зареєструватися</button>
    </form>
    <p class="mt-3 mb-0 text-center">Вже маєте акаунт? <a href="{{ url_for('auth.login') }}">Увійти</a></p>
  </div>
</div>
{% endblock %}
