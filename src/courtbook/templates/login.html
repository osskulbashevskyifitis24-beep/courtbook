{% extends "base.html" %}
{% block title %}Вхід – CourtBook{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="h4 mb-3">Вхід</h1>
    <form method="post">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Увійти</button>
    </form>
    <p class="mt-3 mb-0 text-center">Немає акаунта? <a href="{{ url_for('auth.register') }}">Зареєструватися</a></p>
  </div>
</div>
{% endblock %}
